<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Journey Companion v2: institution, systems and facilitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Nunito:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a stage rail (the journey) on the left, the working panel on the right. Gates sit between stages like checkpoints on a route. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --surface2:#f6f8fa; --ink:#15212d; --muted:#556474; --line:#d6dee6;
  --accent:#1d5aa6; --accent-soft:#e3ecf8; --gate:#a5600d; --gate-soft:#fbefdf;
  --good:#24764a; --good-soft:#e2f2e8; --warn:#9a5b06; --warn-soft:#fdf1dc; --bad:#ad2a22; --bad-soft:#fbe5e3;
  --display:"Public Sans", "Segoe UI", system-ui, sans-serif; --body:"Public Sans", "Segoe UI", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#17212b; --surface2:#1c2833; --ink:#e4ebf1; --muted:#9aabbb; --line:#2c3b48;
  --accent:#7fb0ee; --accent-soft:#1d3048; --gate:#e8a957; --gate-soft:#3a2b17;
  --good:#6fcb98; --good-soft:#163526; --warn:#e8b05a; --warn-soft:#3a2c14; --bad:#f08a80; --bad-soft:#3d1c1a; color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#17212b; --surface2:#1c2833; --ink:#e4ebf1; --muted:#9aabbb; --line:#2c3b48;
  --accent:#7fb0ee; --accent-soft:#1d3048; --gate:#e8a957; --gate-soft:#3a2b17;
  --good:#6fcb98; --good-soft:#163526; --warn:#e8b05a; --warn-soft:#3a2c14; --bad:#f08a80; --bad-soft:#3d1c1a; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.88em}
.topbar{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.topnav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.topnav a{padding:7px 12px;border-radius:6px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
.topnav a.on{background:var(--accent-soft);color:var(--accent)}
.savestate{font-size:12px;color:var(--muted)}
.wrap{display:grid;grid-template-columns:290px minmax(0,1fr);gap:0;min-height:calc(100vh - 60px)}
.rail{border-right:1px solid var(--line);background:var(--surface);padding:18px 14px;position:sticky;top:60px;align-self:start;max-height:calc(100vh - 60px);overflow:auto}
.rail h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 6px 10px}
.stagelink{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:8px 6px;border-radius:8px;text-decoration:none;color:var(--ink)}
.stagelink:hover{background:var(--surface2)}
.stagelink.on{background:var(--accent-soft)}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--line);background:var(--surface);position:relative}
.dot svg{position:absolute;inset:-2px}
.stagelink .t{font-size:13.5px;font-weight:600;line-height:1.25}
.stagelink .p{font-size:11.5px;color:var(--muted)}
.gatemark{margin:2px 0 2px 20px;padding:3px 8px;border-left:2px dashed var(--gate);font-size:11.5px;color:var(--gate);font-weight:700}
main{padding:24px 28px 80px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.stagehead{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.stagehead h1{font-size:28px;font-weight:800;letter-spacing:-.015em;margin:4px 0 6px}
.question{font-size:17px;color:var(--muted);max-width:62ch}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.chip.gate{background:var(--gate-soft);color:var(--gate)}
.chip.low,.chip.good{background:var(--good-soft);color:var(--good)}
.chip.med,.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.high,.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.none{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 0;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button .n{font-size:11px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:6px}
.why{font-size:15.5px;max-width:70ch}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.reading{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface2);display:flex;flex-direction:column;gap:6px}
.reading .src{font-weight:700;font-size:14.5px}
.reading .where{font-family:var(--mono);font-size:12px;color:var(--muted)}
.reading p{margin:0;font-size:14px}
.status{font-size:11.5px;font-weight:700;color:var(--muted)}
.status.draft{color:var(--gate)}
.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:6px}
.concept{border-left:3px solid var(--accent);padding:4px 12px}
.concept b{display:block;font-size:14px}
.concept span{font-size:13.5px;color:var(--muted)}
.sec-title{font-size:18px;font-weight:700;margin:22px 0 10px}
.sec-title:first-child{margin-top:4px}
.q{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.q .qt{font-weight:600;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent}
.opt:hover{background:var(--surface2)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt input{margin-top:4px}
.explain{margin-top:8px;font-size:14px;padding:8px 12px;border-radius:7px;background:var(--surface2)}
.explain .ref{font-family:var(--mono);font-size:12px;color:var(--muted);display:block;margin-top:4px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;margin:0 0 14px}
legend{font-weight:700;padding:0 6px;font-size:15px}
.fdesc{font-size:13.5px;color:var(--muted);margin:-4px 0 12px;max-width:75ch}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label.lbl{font-weight:600;font-size:14px}
.field .hint{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 16px}
input[type=text],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
textarea{min-height:72px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:14px;background:var(--surface)}
.seg input{accent-color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.ynrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ynrow:first-of-type{border-top:0}
.ynrow .seg label{padding:3px 9px;font-size:13px}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px}
.checkrow input{margin-top:4px;accent-color:var(--accent)}
.result{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);margin-top:6px}
.result .big{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.result .msg{font-size:14px;flex:1;min-width:220px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:120px;flex:1}
.bar i{display:block;height:100%;background:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
.tablewrap{overflow-x:auto}
td.r{text-align:center;font-family:var(--mono);font-weight:500}
td.r.A,td.r.AR{color:var(--accent);font-weight:700}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0f161d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0f161d}}
.btn.small{padding:4px 9px;font-size:12.5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--gate-soft);color:var(--ink);border:1px solid var(--gate);margin-bottom:16px;font-size:14px}
.banner b{color:var(--gate)}
.journeymap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.jcard{border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:var(--ink);background:var(--surface);display:flex;flex-direction:column;gap:6px;position:relative}
.jcard:hover{border-color:var(--accent)}
.jcard .num{font-family:var(--mono);font-size:12px;color:var(--muted)}
.jcard b{font-size:15px}
.jcard span{font-size:13px;color:var(--muted)}
.jcard .gate{margin-top:auto}
.lib{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.lib .reading{background:var(--surface)}
.stagechips{display:flex;gap:4px;flex-wrap:wrap}
.stagechips a{font-family:var(--mono);font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);text-decoration:none}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kv div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface2)}
.kv small{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kv b{font-size:16px}
.flag{padding:8px 12px;border-radius:8px;font-size:13.5px;margin:6px 0}
.flag.bad{background:var(--bad-soft);color:var(--bad)}
.flag.warn{background:var(--warn-soft);color:var(--warn)}
.flag.good{background:var(--good-soft);color:var(--good)}
.flag.info{background:var(--accent-soft);color:var(--accent)}
.walkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.walkdim{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.walkdim h5{margin:0 0 6px;font-size:14px}
.meter{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.meter i{height:10px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--accent)}
.meter i.mid{outline:1px solid var(--muted)}
.dialog{position:fixed;inset:0;background:rgba(10,16,22,.5);display:none;place-items:center;z-index:20;padding:16px}
.dialog.open{display:grid}
.dialog .box{background:var(--surface);border-radius:12px;padding:20px;max-width:640px;width:100%;max-height:85vh;overflow:auto;border:1px solid var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
.quad{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);overflow-wrap:anywhere;gap:6px;font-size:13px;margin-top:8px}
.quad div{padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
.quad .ax{background:none;border:0;font-weight:700;color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center}
.quad .hit{border:2px solid var(--accent);background:var(--accent-soft)}
.riskrow td input,.riskrow td select,.riskrow td textarea{font-size:13px;padding:5px 6px}
.riskrow td textarea{min-height:48px}
.vtag{font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:999px;vertical-align:2px}
.railsec{margin:14px 6px 6px;padding-top:12px;border-top:1px solid var(--line)}
.railsec select{font-size:13px;padding:6px 8px;margin-top:6px}
.pathchip{display:inline-flex;gap:6px;align-items:center}
.systable td,.systable th{vertical-align:middle}
.syscur{background:var(--accent-soft)}
.tri{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.session{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;background:var(--surface)}
.session h3{font-size:19px;margin:2px 0 6px}
.session .meta{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.agenda{width:100%;font-size:13.5px}
.agenda td:first-child{width:70px;font-family:var(--mono);color:var(--muted);white-space:nowrap}
.prompt{border-left:3px solid var(--gate);padding:4px 12px;margin:6px 0;font-size:14px}
.present{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;padding:28px 36px;overflow:auto}
.present .stmt{font-size:clamp(26px,4.2vw,52px);font-weight:800;line-height:1.15;max-width:22ch;margin:auto 0}
.present .dir{font-size:20px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.present .dir.f{color:var(--good)} .present .dir.b{color:var(--bad)}
.present .ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.present input[type=number]{width:90px;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:16px}
.dimbar{display:grid;grid-template-columns:200px 1fr 60px;gap:12px;align-items:center;margin:8px 0}
.dimtrack{position:relative;height:14px;border-radius:99px;background:var(--line)}
.dimtrack i{position:absolute;top:-3px;width:20px;height:20px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.dimtrack b{position:absolute;left:50%;top:-4px;bottom:-4px;border-left:2px solid var(--muted)}

/* ===== DCI AI Hub design refresh (2026): navy dominant, sky blue secondary, orange accent; Montserrat headlines, Nunito body ===== */
:root{
  --navy:#1E2746; --sky:#87BEFF; --orange:#FF7D41; --orange-ink:#C24A14; --cream:#FFF1E4;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface2:#EEF4FC; --ink:#1E2746; --muted:#56607D; --line:#DCE2EC;
  --accent:#1E2746; --accent-soft:#E2EEFF; --link:#2457B5; --gate:#C24A14; --gate-soft:#FFE9DE;
  --good:#1E7A4E; --good-soft:#E2F3E9; --warn:#8F5506; --warn-soft:#FDF1DC; --bad:#B3261E; --bad-soft:#FBE4E2;
  --display:"Montserrat","Segoe UI",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141A30; --surface:#1E2746; --surface2:#262F55; --ink:#EEF2FA; --muted:#A9B3CC; --line:#343E66;
  --accent:#87BEFF; --accent-soft:#2A3A66; --link:#9CCBFF; --gate:#FF9A6B; --gate-soft:#4A2B22; --orange-ink:#FF9A6B; --cream:#33304A;
  --good:#6FCB98; --good-soft:#163526; --warn:#E8B05A; --warn-soft:#3A2C14; --bad:#F08A80; --bad-soft:#3D1C1A; }}
html,body{font-family:var(--body)}
a{color:var(--link)}
h1,h2,h3,h4,legend,.sec-title,.brand b,.stagelink .t,.jcard b,.btn,.tabs button,.chip,.eyebrow,.kv small,.session h3{font-family:var(--display)}
.topbar{background:var(--navy);border-bottom:0;color:#fff;padding:10px 22px}
.brand{display:flex;flex-direction:row;align-items:center;gap:16px;text-decoration:none;color:#fff}
.brand .logo{height:42px;width:auto;display:block}
.brand .bt{display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,.25);padding-left:16px}
.brand .bt b{font-size:14px;font-weight:800;letter-spacing:.06em;color:#fff}
.brand .bt span{font-size:12px;color:#BFD9FF}
.topnav a{color:#DDE7F7;font-family:var(--display);font-weight:600;font-size:13.5px}
.topnav a:hover{color:#fff;background:rgba(135,190,255,.14)}
.topnav a.on{background:var(--sky);color:var(--navy)}
.savestate{color:#A9B9D9;position:absolute;right:24px;bottom:3px;font-size:11px}
.topbar{position:sticky}
.rail{top:64px;max-height:calc(100vh - 64px)}
.stagehead ~ .kvis,.panel.hero .kvis{opacity:.85}
.panel.hero:has(.stagehead) .kvis{opacity:.32}
.vtag{display:none}
.eyebrow{color:var(--orange-ink);font-weight:700;letter-spacing:.08em}
.sec-title{font-weight:700;color:var(--ink)}
.panel{border-radius:14px}
.panel.hero{background:var(--navy);color:#fff;border-color:var(--navy);position:relative;overflow:hidden}
.panel.hero .eyebrow{color:var(--orange)}
.panel.hero h1{color:#fff}
.panel.hero .question,.panel.hero .why{color:#CFE2FF}
.panel.hero .kv-hero{color:#CFE2FF}
.panel.hero .tabs{border-bottom-color:rgba(255,255,255,.18)}
.panel.hero .tabs button{color:#BFD0EA}
.panel.hero .tabs button.on{color:#fff;border-bottom-color:var(--orange)}
.panel.hero .tabs button .n{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.panel.hero .chip.info{background:rgba(135,190,255,.18);color:#DDEBFF}
.panel.hero .chip.gate{background:var(--orange);color:var(--navy)}
.panel.hero .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.panel.hero .btn:hover{border-color:var(--sky)}
.panel.hero .btn.primary{background:var(--orange);border-color:var(--orange);color:var(--navy)}
.panel.hero a:not(.btn){color:var(--sky)}
.stagehead h1{font-weight:800;text-transform:uppercase;letter-spacing:.01em;font-size:30px}
.stagehead{position:relative;z-index:1}
.kvis{position:absolute;right:-10px;top:-10px;bottom:-10px;width:300px;opacity:.9;pointer-events:none}
.panel.hero > *:not(.kvis){position:relative;z-index:1}
.hero-title{font-size:44px;font-weight:800;text-transform:uppercase;line-height:1.02;margin:10px 0 12px;max-width:16ch}
.hero-title em{font-style:normal;color:var(--orange)}
.sicon{color:var(--ink);width:46px;height:46px;border-radius:50%;background:var(--cream);display:grid;place-items:center;flex:none}
.sicon svg{width:28px;height:28px}
.panel.hero .sicon{background:#FFF1E4;color:#1E2746}
.stagehead .sicon{width:64px;height:64px}.stagehead .sicon svg{width:38px;height:38px}
.btn{border-radius:8px;font-weight:700;font-size:13.5px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#2C3864}
.btn.cta{background:var(--orange);border-color:var(--orange);color:var(--navy)}
:root[data-theme="dark"] .btn.primary{background:var(--sky);border-color:var(--sky);color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--sky);border-color:var(--sky);color:var(--navy)}}
.chip.info{background:var(--accent-soft);color:var(--ink)}
.chip.gate{background:var(--gate-soft);color:var(--gate)}
.tabs button{font-weight:700;font-size:13.5px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--orange)}
.rail{background:var(--surface)}
.rail h4{font-family:var(--display);color:var(--muted)}
.stagelink.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--orange)}
.dot{border-color:var(--line)}
.dot svg circle{stroke:var(--orange)}
.gatemark{border-left-color:var(--orange);color:var(--orange-ink)}
.jcard{border-radius:12px;border-top:4px solid var(--navy);gap:8px}
.jcard.inst{border-top-color:var(--sky)}
.jcard:hover{border-color:var(--orange);border-top-color:var(--orange)}
.jcard .jhead{display:flex;gap:10px;align-items:center}
.jcard b{font-family:var(--display);font-weight:700;font-size:15px}
.banner{border-left:5px solid var(--orange);border-color:var(--orange);background:var(--gate-soft)}
.banner b{color:var(--orange-ink)}
fieldset{border-radius:12px}
legend{font-weight:700;color:var(--ink)}
.result .big{font-family:var(--display)}
.opt.right{border-color:var(--good)}
.reading .src{font-family:var(--display);font-weight:700;font-size:14px}
.concept{border-left-color:var(--orange)}
.flag.info{background:var(--accent-soft);color:var(--ink)}
.doccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.doccard{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.doccard .dh{display:flex;gap:12px;align-items:center}
.doccard h3{font-size:16px;font-weight:700;margin:0}
.doccard .fmt{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.doccard .miss{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.docstrip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border:1px dashed var(--sky);border-radius:10px;background:var(--accent-soft);margin-bottom:14px}
.docstrip b{font-family:var(--display);font-size:13px}
.docpill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px;font-weight:600;color:var(--ink)}
.docpill .pc{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.docpill button{border:0;background:var(--navy);color:#fff;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--display)}
.bar i{background:var(--orange)}

.grid2{align-items:end}
.trigrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px;align-items:end}
.trigrid .field{margin-bottom:14px}
.trigrid select{min-height:42px}
@media (max-width:860px){.trigrid{grid-template-columns:1fr}}
.foot{font-size:12.5px;color:var(--muted);margin-top:28px;max-width:80ch}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:4px;padding:10px}
  .rail h4,.gatemark{display:none}
  .stagelink{grid-template-columns:30px;min-width:64px;justify-items:center;text-align:center}
  .stagelink .t{font-size:11px}.stagelink .p{display:none}
  main{padding:16px}
  .panel{padding:16px}
  .topbar{position:static}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}



/* ===== about this tool ===== */
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:32px}
.about p{font-size:15px;line-height:1.6;margin:0 0 10px}
.about-list{margin:4px 0 12px;padding-left:18px;display:grid;gap:6px;font-size:14.5px;line-height:1.5}
.about-note{font-size:13.5px!important;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.goto{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gocard{display:flex;flex-direction:column;gap:3px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:var(--ink)}
a.gocard:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(30,39,70,.08)}
.gocard b{font-family:var(--display);font-size:14.5px}
.gocard span{font-size:13px;color:var(--muted);line-height:1.4}
.gocard em{font-style:normal;font-weight:700;font-size:13px;color:var(--accent);margin-top:auto;padding-top:4px}
@media (max-width:980px){.about-grid{grid-template-columns:1fr;gap:20px}}
@media (max-width:560px){.goto{grid-template-columns:1fr}}
/* ===== source lines ===== */
.srcline{margin:0 0 12px;padding:7px 11px;border-left:3px solid var(--sky,#87BEFF);background:#F2F7FF;border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.45;color:#3B4660}
.srcline b{font-family:var(--display);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-right:6px}
@media print{.srcline{background:none}}
/* ===== role view ===== */
.rolepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rolecard{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit;color:var(--ink)}
.rolecard b{font-family:var(--display);font-size:15px}
.rolecard span{font-size:13.5px;color:var(--muted);line-height:1.45}
.rolecard:hover{border-color:var(--accent)}
.rolecard.on{border-color:var(--navy,#1E2746);background:var(--navy,#1E2746);color:#fff}.rolecard.on span{color:#C9D6EA}
.rolecard.fac{border-style:dashed}
.rolehead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.rolehead h2{margin:2px 0 4px;font-size:21px}.rolehead p{margin:0;color:var(--muted);font-size:14.5px;max-width:70ch}
.mystages{display:grid;gap:6px;margin-top:14px}
.mystage{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--surface)}
.mystage:hover{border-color:var(--accent)}
.mystage.dim{opacity:.6}
.ms-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;display:grid;place-items:center}
.ms-t{flex:1;min-width:0}.ms-t b{display:block;font-size:14.5px}.ms-t small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.rl{flex:none;display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;white-space:nowrap}
.rl-A{background:#FF7D41;color:#fff}.rl-R{background:#1E2746;color:#fff}.rl-P{background:#1E2746;color:#fff}.rl-C{background:#DCEBFF;color:#1E2746}.rl-I{background:#EEF1F6;color:#5B6478}.rl-n{background:#EEF1F6;color:#8A93A6}
.rolebox{margin-bottom:16px;padding:12px 16px;border-radius:12px;background:#EEF5FF;border:1px solid #CFE1FB;font-size:14.5px;line-height:1.5}
.rolebox ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.rolebox.dim{background:var(--surface2,#F3F5F9);border-color:var(--line)}
.rolebox.fac{background:#FFF8F0;border:1px dashed #FFB98F}
.invite{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13.5px}
.chip.yours{background:#1E2746;color:#fff}
.wl{font-size:12.5px;color:var(--muted)}
.othergrp{background:var(--surface2,#F3F5F9)}
.rolechip{display:block;margin:0 0 12px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink)}
.rolechip span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rolechip b{font-size:13.5px}
.stagelink.rdim,.jcard.rdim{opacity:.55}
.stagelink{position:relative}
.stagelink .rl{position:absolute;right:6px;top:8px;font-size:11px;padding:1px 7px}
.stagelink:has(.rl) .t{display:inline-block;padding-right:30px}
.jrole{order:10;margin-top:auto}
@media (max-width:860px){.rolehead{flex-direction:column}}

/* ===== simplified journey ===== */
fieldset{min-width:0}
.chip{max-width:100%;white-space:normal;overflow-wrap:anywhere}
.cols>*,.grid2>*{min-width:0}
.statusbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:9px 14px;margin-bottom:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13.5px;color:var(--muted)}
.statusbar b{color:var(--ink)}
.sb-item{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.sb-ex{padding-right:16px;border-right:1px solid var(--line)}
.sb-item a,.lnk{color:var(--accent);font-weight:700;background:none;border:0;padding:0;font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
.stagechips{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.inshort{border:1px solid var(--line);border-left:4px solid var(--orange,#FF7D41);border-radius:12px;padding:16px 20px;background:var(--surface)}
.is-h{font-family:var(--display);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:10px}
.is-grid{display:grid;grid-template-columns:1fr 1.4fr 1.2fr;gap:18px}
.is-grid b{display:block;font-family:var(--display);font-size:15px;margin-bottom:4px}
.is-grid span{font-size:14.5px;line-height:1.5}
ul.aware{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.aware li{position:relative;padding:10px 14px 10px 40px;background:#FFF6EC;border-radius:10px;font-size:14.5px;line-height:1.5}
ul.aware li:before{content:"!";position:absolute;left:12px;top:10px;width:19px;height:19px;border-radius:50%;background:var(--orange,#FF7D41);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center}
ol.gsteps{list-style:none;counter-reset:gs;padding:0;margin:0;display:grid;gap:8px}
ol.gsteps li{counter-increment:gs;position:relative;padding:11px 14px 11px 50px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
ol.gsteps li:before{content:counter(gs);position:absolute;left:14px;top:11px;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;display:grid;place-items:center}
ol.gsteps b{display:block;font-size:15px}
ol.gsteps span{display:block;font-size:14px;color:var(--muted);line-height:1.5;margin-top:2px}
.gnote{margin-top:14px;padding:14px 16px;border:1.5px solid var(--gate);border-radius:12px;background:#FFF3EC;font-size:14.5px;line-height:1.55}
.gnote b{color:var(--gate)}
.gopts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gopts span{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;color:var(--ink)}
ul.readyl{list-style:none;padding:0;margin:0;display:grid;gap:6px}
ul.readyl li{padding:9px 14px 9px 38px;position:relative;background:#E9F7EF;border-radius:8px;font-weight:600;font-size:14.5px}
ul.readyl li:before{content:"✓";position:absolute;left:14px;top:8px;color:#1E7B4A;font-weight:800}
.btnrow.cta{align-items:center;margin-top:20px}
.btnrow.cta .hint{font-size:13px;color:var(--muted)}
details.wfold{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:10px}
details.wfold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 16px;min-height:48px}
details.wfold>summary::-webkit-details-marker{display:none}
details.wfold>summary .wt{font-family:var(--display);font-weight:700;font-size:15.5px;flex:1;display:flex;gap:10px;align-items:center}
.wn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--navy,#1E2746);color:#fff;font-size:12.5px;font-weight:800;display:grid;place-items:center}
.wm{flex:none}
.chev{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);position:relative}
.chev:after{content:"";position:absolute;left:9px;top:7px;width:7px;height:7px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);transition:transform .15s}
details[open]>summary .chev:after{transform:rotate(-135deg);top:11px}
.wbody{padding:0 16px 16px}
.wbody>fieldset{border:0;padding:0;margin:0}
details.morecases>summary{cursor:pointer;font-weight:700;color:var(--accent);padding:10px 0}
.howsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:720px;margin:18px 0 6px}
.howsteps div{border-top:2px solid var(--sky,#87BEFF);padding-top:8px}
.howsteps b{display:block;color:#fff;font-family:var(--display)}
.howsteps span{color:#BFD9FF;font-size:13.5px}
.navmore{position:relative}
.navmore>summary{list-style:none;cursor:pointer;padding:7px 12px;border-radius:6px;color:#DDE7F7;font-family:var(--display);font-weight:600;font-size:13.5px}
.navmore>summary::-webkit-details-marker{display:none}
.navmore>summary:after{content:" ▾";font-size:10px}
.navmore>summary:hover{color:#fff;background:rgba(135,190,255,.14)}
.navmore>summary.on{background:var(--sky);color:var(--navy)}
.navpop{position:absolute;right:0;top:calc(100% + 6px);z-index:50;background:var(--navy,#1E2746);border-radius:10px;padding:6px;min-width:180px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(10,16,34,.35)}
@media (max-width:860px){
  .is-grid{grid-template-columns:1fr;gap:12px}
  .howsteps{grid-template-columns:1fr}
  .stagechips{flex-direction:row;align-items:center;flex-wrap:wrap}
  .sb-ex{border-right:0;padding-right:0}
  .navmore>summary{display:none}
  .navmore .navpop{position:static;box-shadow:none;padding:0;background:none;min-width:0}
}
@media print{details.wfold>.wbody{display:block}.statusbar{display:none}}

@media print{.topbar,.rail,.btnrow,.tabs{display:none}.wrap{display:block}.panel{break-inside:avoid}}

   {r:"rf", where:"Ch. 5 Tool 3 · Annex 2 Rights-based foundation", take:"Each register entry names the rights it touches (privacy and data security; equality and non-discrimination; autonomy, dignity and due process; accountability and redress) and links to a Tool 2 context factor. The register here records both, and downloads as a filled Excel file."}

/* ---------- Triage: proportionate path (Playbook §4.4; Tool 1 high-risk indicators; Taxonomy §2.1) ---------- */
const TRI_SCALE=["Fewer than 5,000 people","Tens of thousands","Hundreds of thousands or more"];
function triage(a){ a=a||A(); const r=[]; const need=["entitle","sensitivity","users","tri_scale","agentic"];
  if(need.some(k=>!a[k])) return {path:"", reasons:["Answer all triage questions."], done:false};
  if(a.entitle&&(a.entitle.startsWith("Directly")||a.entitle.startsWith("Informs"))) r.push("It determines or informs decisions on entitlements, payments or sanctions");
  if(["Sensitive","Special category (e.g. biometric, health)"].includes(a.sensitivity)) r.push("It uses sensitive or special-category data");
  if(a.tri_scale===TRI_SCALE[2]) r.push("It could affect hundreds of thousands of people or more");
  if(a.agentic&&a.agentic!=="No") r.push("It takes actions in systems (agentic)");
  HIGHSEV.forEach((x,i)=>{ if(a["hs_"+i]) r.push("High-risk indicator: "+x[0]); });
  const forced=r.length>0; const path=forced||a.path_choice==="full"?"full":"light";
  return {path, forced, reasons: forced?r:["No high-impact trigger: service-quality effect, non-sensitive or personal data, limited scale, no autonomous actions"+(a.path_choice==="full"?" (team chose the full path anyway)":"")], done:true}; }
function isLight(){ const s=curSys(); if(!s) return false; const t=triage(s.a); return t.done&&t.path==="light"; }

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function walkPos(i){ let f=0,b=0; for(let j=0;j<3;j++){ if(A()["wk_"+i+"_f_"+j])f++; if(A()["wk_"+i+"_b_"+j])b++; } return f-b; }

function oversightCheck(){ const r=requiredOversight(A().criticality), o=A().oversight; if(!r||!o) return ""; const ord=["HITL","HOTL","HOOTL"]; return ord.indexOf(o)<=ord.indexOf(r)?"OK":"Below required"; }
function t1Tier(){ const v=["t1_lik","t1_sev","t1_sca"].map(k=>A()[k]); if(v.some(x=>!x)) return ""; if(v.includes("High")) return "High"; if(v.every(x=>x==="Medium")) return "High"; if(v.every(x=>x==="Low")) return "Low"; return "Medium"; }
function crmTier(){ const v=["t2_legal","t2_inst","t2_data","t2_trust"].map(k=>A()[k]); if(v.some(x=>!x)) return ""; const s=v.filter(x=>x==="Strong").length,w=v.filter(x=>x==="Weak").length; if(w>=2||(w===1&&s===0)) return "Weak"; if(s>=3&&w===0) return "Strong"; return "Moderate"; }
function overallTier(){ const t=t1Tier(),c=crmTier(); if(!t||!c) return ""; let i=TIERS.indexOf(t); if(c==="Strong") i=Math.max(0,i-1); if(c==="Weak") i=Math.min(2,i+1); return TIERS[i]; }
function tierAction(t){return {Low:"Go",Medium:"Pilot",High:"No-Go / Pause"}[t]||""}
function t4Status(){ let n=0,yes=0,no=0; T4.forEach(g=>g[1].forEach(()=>{const v=A()["t4_"+n]; if(v==="Yes")yes++; else if(v==="No")no++; n++;})); return {n,yes,no}; }
function t4Decision(){ const t=overallTier(), s=t4Status(); if(!t) return {d:"",why:"Complete Tools 1 and 2 in Stage 5 to get the overall tier."}; if(a_redline()) return {d:"No-Go",why:"A fundamental red line is marked in the Stage 4 screening: automatic No-Go until it is resolved."}; if(blockingOpen().length) return {d:"No-Go",why:blockingOpen().length+" Blocking risk(s) still open in the Risk Register: automatic No-Go until resolved."}; if(s.no>0) return {d:"No-Go",why:s.no+" minimum safeguard(s) marked No: automatic No-Go."}; if(t==="High") return {d:"No-Go",why:"Overall risk tier is High: defer until risks fall or governance capacity improves."}; if(s.yes<s.n) return {d:"",why:(s.n-s.yes)+" checklist item(s) still unanswered."}; return t==="Low"?{d:"Go",why:"Low tier and all 19 safeguards confirmed."}:{d:"Pilot",why:"Medium tier and all 19 safeguards confirmed: controlled, time-bound pilot with HITL on every decision point."}; }

function filled(k){ const a=A(); if(k==="walk") return WALK.some((_,i)=>[0,1,2].some(j=>a["wk_"+i+"_f_"+j]||a["wk_"+i+"_b_"+j])); if(k==="risks") return (a.risks||[]).length>0; if(k.startsWith("gate")) return (a.gates||[]).some(g=>g.g==+k.slice(4)); const v=a[k]; return v!==undefined&&v!==""&&v!==false; }

function fieldHTML(f){

  if(f.t==="text") inp=`<input type="text" id="${id}" data-k="${f.k}" value="${esc(v)}"${f.ph?` placeholder="${esc(f.ph)}"`:""}>`;
  else if(f.t==="date") inp=`<input type="date" id="${id}" data-k="${f.k}" value="${esc(v)}">`;
  else if(f.t==="textarea") inp=`<textarea id="${id}" data-k="${f.k}"${f.ph?` placeholder="${esc(f.ph)}"`:""}>${esc(v)}</textarea>`;
  else if(f.t==="select") inp=`<select id="${id}" data-k="${f.k}"><option value="">Choose…</option>${opts(f).map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(f.t==="radio") inp=`<div class="seg" role="radiogroup" aria-labelledby="${id}_l">${opts(f).map((o,i)=>`<label><input type="radio" name="${id}" id="${id}_${i}" data-k="${f.k}" value="${esc(o)}" ${o===v?"checked":""}>${esc(o)}</label>`).join("")}</div>`;
  else if(f.t==="multi"){ const sel=Array.isArray(v)?v:[]; inp=`<div class="multi" role="group" aria-labelledby="${id}_l">${opts(f).map((o,i)=>`<label class="checkrow" for="${id}_${i}"><input type="checkbox" id="${id}_${i}" data-mk="${f.k}" value="${esc(o)}" ${sel.includes(o)?"checked":""}><span>${esc(o)}</span></label>`).join("")}</div>`; }
  else if(f.t==="check") return `<label class="checkrow" for="${id}"><input type="checkbox" id="${id}" data-k="${f.k}" ${v?"checked":""}><span>${esc(f.l)}</span></label>`;
  return `<div class="field"><label class="lbl" id="${id}_l" for="${id}">${esc(f.l)}</label>${f.h?`<span class="hint">${esc(f.h)}</span>`:""}${inp}</div>`;
}
function seg(k,options,cur,label){ return `<div class="seg" role="radiogroup" aria-label="${esc(label||k)}">${options.map((o,i)=>`<label><input type="radio" name="${k}" id="${k}_${i}" data-k="${k}" value="${esc(o)}" ${o===cur?"checked":""}>${esc(o)}</label>`).join("")}</div>`; }
function fieldset(b){ b={...b,fields:b.fields.filter(f=>!(f.full&&isLight()))}; if(!b.fields.length) return ""; return `<fieldset><legend>${esc(b.legend)}</legend>${b.desc?`<p class="fdesc">${esc(b.desc)}</p>`:""}<div class="${b.fields.length>3&&b.fields.every(f=>f.t==="text"||f.t==="select")?"grid2":""}">${b.fields.map(fieldHTML).join("")}</div></fieldset>`; }

  return h+`</fieldset>`; },
 gate(b){ const G=GATES[b.gate]; const log=(A().gates||[]).filter(x=>x.g===b.gate); const def=b.gate===2?(t4Decision().d==="Pilot"?"Authorise a controlled pilot":t4Decision().d==="Go"?"Authorise deployment (Go)":t4Decision().d==="No-Go"?"Pause (No-Go)":""):"";

  const all=A().gates||[]; if(log.length) h+=`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Decision</th><th>Approving authority</th><th>Conditions</th><th>Next review</th><th></th></tr></thead><tbody>${log.map(x=>{const gi=all.indexOf(x); return `<tr><td class="mono">${esc(x.date)}</td><td><b>${esc(x.dec)}</b></td><td>${esc(x.who)}</td><td>${esc(x.cond)}</td><td class="mono">${esc(x.next)}</td><td style="white-space:nowrap"><button class="btn small" data-editgate="${gi}">Edit</button> <button class="btn small" data-delgate="${gi}" aria-label="Delete this gate decision">✕</button></td></tr>`}).join("")}</tbody></table></div>`;

function nextSteps(){ const a=A(), out=[]; const d=drScore();

function registerAll(){ const rows=S.systems.map(s=>withSys(s.id,()=>registerRow().split("\n")[1])); return (S.systems.length?withSys(S.systems[0].id,()=>registerRow().split("\n")[0]):"")+"\n"+rows.join("\n")+"\n"; }
function dossierMD(){ const a=A(), d=drScore(); let m=`# AI Journey dossier: ${a.sys||"Untitled"}\n\n${a.inst||""} · ${a.prog||""}\nGenerated ${new Date().toISOString().slice(0,10)} with the DCI AI Hub AI Journey Companion.${S.isExample?"\n\n> Worked example (fictional).":""}\n\n## Summary\n\n| Item | Result |\n|---|---|\n| Data readiness | ${!d.ans?"–":d.done?d.tot+"/34 ("+d.lvl+")":"Incomplete ("+d.ans+"/17)"} |\n| Decision criticality / oversight | ${a.criticality||"–"} / ${a.oversight||"–"} ${oversightCheck()} |\n| Intrinsic risk (Tool 1) | ${t1Tier()||"–"} |\n| Context multiplier (Tool 2) | ${crmTier()||"–"} |\n| Overall risk tier | ${overallTier()||"–"} |\n| Tool 4 decision | ${t4Decision().d||"–"} |\n| Sovereignty quadrant | ${quadrant()||"–"} |\n\n`;
  STAGES.forEach(st=>{ m+=`## Stage ${st.id}. ${st.title}\n\n`; st.work.forEach(b=>{ if(b.fields) b.fields.forEach(f=>{ const v=a[f.k]; if(v!==undefined&&v!==""&&v!==false) m+=`- **${f.l}:** ${v===true?"Yes":String(v).replace(/\n/g," ")}\n`; }); }); m+="\n"; });
  m+=`## Risk register\n\n| ID | Risk | Sev/Lik | Mitigation | Owner | Status | Implication |\n|---|---|---|---|---|---|---|\n`+(a.risks||[]).map(r=>`| ${r.id} | ${r.desc} | ${r.sev}/${r.lik} | ${r.mit} | ${r.owner} | ${r.status} | ${r.impl} |`).join("\n")+`\n\n## Gate decisions\n\n`+(a.gates||[]).map(g=>`- Gate ${g.g} · ${g.date} · **${g.dec}** · ${g.who} · ${g.cond} · next review ${g.next}`).join("\n")+"\n";
  return m; }
let DL=null; (async()=>{ try{ if(window.claude&&window.claude.use) DL=await window.claude.use("downloads"); }catch(e){ DL=null; } })();
async function offer(filename,data){ if(!DL){ try{ if(window.claude&&window.claude.use) DL=await window.claude.use("downloads"); }catch(e){} } if(DL){ try{ await DL.save({filename,data}); toast("Saved "+filename); return; }catch(e){ if(e&&e.code==="declined") return; } } if(data instanceof Blob){ try{ const u=URL.createObjectURL(data); const l=document.createElement("a"); l.href=u; l.download=filename; document.body.appendChild(l); l.click(); setTimeout(()=>{URL.revokeObjectURL(u); l.remove();},1500); toast("Downloading "+filename); }catch(e){ toast("Downloads are not available in this view"); } return; } if(!window.claude){ try{ const b=new Blob([data],{type:"text/plain;charset=utf-8"}); const u=URL.createObjectURL(b); const l=document.createElement("a"); l.href=u; l.download=filename; document.body.appendChild(l); l.click(); setTimeout(()=>{URL.revokeObjectURL(u); l.remove();},1500); toast("Downloading "+filename); return; }catch(e){} } showText(filename,data); }
function showText(name,data){ $("#dlgbox").innerHTML=`<h3 style="margin-bottom:8px">${esc(name)}</h3><p class="fdesc">Downloads are not available here. Copy the text below and save it as <span class="mono">${esc(name)}</span>.</p><textarea id="dlgtext" style="min-height:280px;font-family:var(--mono);font-size:12px">${esc(data)}</textarea><div class="btnrow"><button class="btn primary" id="dlgcopy">Copy</button><button class="btn" id="dlgclose">Close</button></div>`; $("#dlg").classList.add("open"); }
function confirmBox(msg,yes,onYes){ $("#dlgbox").innerHTML=`<p>${msg}</p><div class="btnrow"><button class="btn primary" id="cyes">${yes}</button><button class="btn" id="dlgclose">Cancel</button></div>`; $("#dlg").classList.add("open"); $("#cyes").onclick=()=>{ $("#dlg").classList.remove("open"); onYes(); }; }

/* ===================== EVENTS ===================== */
function route(){ const h=(location.hash||"#start").slice(1); let m;
  ["start","inst","systems","documents","cases","facilitator","library","dossier"].forEach(n=>$("#nav-"+n).classList.remove("on"));
  document.querySelector(".wrap").style.display="";
  if((m=h.match(/^stage-(\d)$/))&&+m[1]>=1&&+m[1]<=STAGES.length){ renderRail(+m[1]); renderStage(+m[1]); $(+m[1]<=3?"#nav-inst":"#nav-systems").classList.add("on"); }
  else if(h==="systems"){ renderRail(0); renderSystems(); $("#nav-systems").classList.add("on"); }
  else if(h==="triage"||(m=h.match(/^triage-([a-z0-9]+)$/))){ renderRail(0); renderTriage(m?m[1]:null); $("#nav-systems").classList.add("on"); }
  else if(h==="documents"){ renderRail("docs"); renderDocuments(); $("#nav-documents").classList.add("on"); }
  else if(h==="cases"){ renderRail(0); renderCases(); $("#nav-cases").classList.add("on"); }
  else if(h==="facilitator"){ renderRail("fac"); renderFacilitator(); $("#nav-facilitator").classList.add("on"); }
  else if(h==="walk-present"){ renderRail("fac"); renderPresent(); $("#nav-facilitator").classList.add("on"); }
  else if(h==="walk-room"){ renderRail("fac"); renderRoom(); $("#nav-facilitator").classList.add("on"); }
  else if(h==="library"){ renderRail(0); renderLibrary(); $("#nav-library").classList.add("on"); }
  else if(h==="role"){ renderRail(0); renderRole(); }
  else if(h==="dossier"){ renderRail(0); renderDossier(); $("#nav-dossier").classList.add("on"); }
  else { renderRail(0); renderStart(); $("#nav-start").classList.add("on"); }
  $("#nav-facilitator").style.display=isFac()?"":"none";
  const nm=$("#navmore"); if(nm){ nm.open=NAVSMALL.matches; $("#nav-more").classList.toggle("on",!!nm.querySelector("a.on")); } }
const NAVSMALL=window.matchMedia("(max-width:860px)");
NAVSMALL.addEventListener("change",()=>{ const nm=$("#navmore"); if(nm) nm.open=NAVSMALL.matches; });
document.addEventListener("click",e=>{ const nm=$("#navmore"); if(nm&&nm.open&&!NAVSMALL.matches&&!nm.contains(e.target)) nm.open=false; });
function rerenderKeepFocus(){ const ae=document.activeElement; const id=ae&&ae.id; const pos=ae&&ae.selectionStart; const y=window.scrollY; route(); if(id){ const el=document.getElementById(id); if(el){ el.focus({preventScroll:true}); try{ if(pos!=null) el.setSelectionRange(pos,pos);}catch(e){} } } window.scrollTo(0,y); }
const LIVE = new Set(["text","date","textarea"]);
document.addEventListener("input",e=>{ const el=e.target;
  if(el.dataset.r!==undefined){ A().risks[+el.dataset.r][el.dataset.f]=el.value; save(); if(el.tagName==="SELECT") rerenderKeepFocus(); return; }
  if(el.dataset.mk){ const mk=el.dataset.mk, cur=Array.isArray(A()[mk])?A()[mk].slice():[]; const i=cur.indexOf(el.value); if(el.checked&&i<0) cur.push(el.value); if(!el.checked&&i>=0) cur.splice(i,1); A()[mk]=cur; save(); rerenderKeepFocus(); return; }
  const k=el.dataset.k; if(!k) return;
  if(el.type==="checkbox") A()[k]=el.checked; else A()[k]=el.value;
  save(); if(!(LIVE.has(el.type)||el.tagName==="TEXTAREA")) rerenderKeepFocus(); else renderRail(+((location.hash.match(/stage-(\d)/)||[])[1]||0));
});
document.addEventListener("input",e=>{ const el=e.target;
  if(el.dataset.tri){ const id=(location.hash.match(/^#triage-([a-z0-9]+)$/)||[])[1]; const s=id?S.systems.find(x=>x.id===id):null; const a=s?s.a:triDraft; const k=el.dataset.tri; a[k]= el.type==="checkbox"?(k==="path_choice"?(el.checked?"full":""):el.checked):el.value; if(s) save(); if(el.type!=="text"){ const y=window.scrollY; renderTriage(id||null); renderRail(0); window.scrollTo(0,y); } else { const b=$("#createsys"); const t=triage(a); if(b) b.disabled=!(t.done&&a.sys); } return; }
  if(el.dataset.cf){ CF[el.dataset.cf]=el.value; if(el.type==="text"){ const pos=el.selectionStart; renderCases(); const x=$("#cf_q"); x.focus(); x.setSelectionRange(pos,pos); } else renderCases(); return; }
  if(el.id==="wsize"){ room().size=el.value; save(); return; }
  if(el.id==="wcount"){ const x=WALKLIST[wIdx]; room().c[x.i+"_"+x.dir+"_"+x.j]=el.value; save(); return; }
}, true);
document.addEventListener("change",e=>{ const el=e.target;
  if(el.id==="syspick"){ S.cur=el.value; save(); route(); toast("Now working on "+(curSys().a.sys||"Untitled system")); return; }
  if(el.dataset.quiz){ S.quiz[el.dataset.quiz]=+el.value; save(); rerenderKeepFocus(); }
  if(el.id==="importfile"&&el.files[0]){ const r=new FileReader(); r.onload=()=>{ try{ let o=JSON.parse(r.result); if(!o.a&&!o.v) throw 0; o=fix(o); o.isExample=false; S=o; save(); route(); toast("Journey loaded"); }catch(x){ toast("That file is not a journey file from this tool"); } }; r.readAsText(el.files[0]); el.value=""; }
  if(el.tagName==="INPUT"&&(el.type==="text"||el.type==="date")&&el.dataset.k) rerenderKeepFocus();
});
document.addEventListener("click",e=>{ const rb=e.target.closest("[data-role]"); if(rb){ setRole(rb.dataset.role); toast("Role set: "+roleDef().t); if(location.hash==="#role") location.hash="#start"; else { route(); } return; } });
document.addEventListener("click",e=>{ const t=e.target.closest("button,[data-tab],a[data-opensys]"); if(!t) return;
  if(t.dataset.tab){ curTab=t.dataset.tab; route(); window.scrollTo(0,0); return; }
  if(t.dataset.delgate!==undefined){ const gi=+t.dataset.delgate; confirmBox("Delete this gate decision record?","Delete",()=>{ A().gates.splice(gi,1); save(); rerenderKeepFocus(); toast("Gate decision deleted"); }); return; }
  if(t.dataset.editgate!==undefined){ const gi=+t.dataset.editgate, x=A().gates[gi]; A().gates.splice(gi,1); save(); rerenderKeepFocus(); const g=x.g; $("#gd_"+g).value=x.dec; $("#gw_"+g).value=x.who||""; $("#gdt_"+g).value=x.date||""; $("#gn_"+g).value=x.next||""; $("#gc_"+g).value=x.cond||""; $("#gd_"+g).scrollIntoView({block:"center"}); $("#gd_"+g).focus(); toast("Editing: change the fields and record the decision again"); return; }
  if(t.id==="addrisk"){ A().risks.push({id:"R-"+String(A().risks.length+1).padStart(3,"0"),src:"",desc:"",sev:"",lik:"",mit:"",owner:"",due:"",status:"Open",ev:"",impl:""}); save(); rerenderKeepFocus(); return; }
  if(t.dataset.delrisk!==undefined){ A().risks.splice(+t.dataset.delrisk,1); save(); rerenderKeepFocus(); return; }
  if(t.dataset.recgate){ const g=+t.dataset.recgate; const dec=$("#gd_"+g).value; if(!dec){ toast("Choose a decision first"); return; } A().gates.push({g,date:$("#gdt_"+g).value||new Date().toISOString().slice(0,10),dec,who:$("#gw_"+g).value,cond:$("#gc_"+g).value,next:$("#gn_"+g).value}); save(); rerenderKeepFocus(); toast("Gate "+g+" decision recorded"); return; }
  if(t.dataset.doc){ docDownload(t.dataset.doc,t.dataset.fmt); return; }
  if(t.id==="cfclear"){ CF={q:"",pil:"",cap:"",uc:"",dc:"",reg:"",inc:"",st:"",crit:"",sort:"match"}; renderCases(); return; }
  if(t.dataset.trkrisk){ const d=t.dataset.trkrisk, ex=similarCases(10).filter(r=>(r.c.rd||[]).includes(d)).slice(0,3).map(r=>r.c.id); A().risks.push({id:"R-"+String(A().risks.length+1).padStart(3,"0"),src:"AI Hub Tracker: similar cases",desc:d+" (seen in "+t.dataset.trkn+" similar cases, e.g. "+ex.join(", ")+")",sev:"",lik:"",mit:"",owner:"",due:"",status:"Open",ev:"",impl:""}); save(); rerenderKeepFocus(); toast("Added to the Risk Register: rate it and assign an owner"); return; }
  if(t.id==="createsys"){ const s=newSys(); s.a=triDraft; triDraft=null; S.systems.push(s); S.cur=s.id; save(); location.hash="#stage-4"; toast("System created"); return; }
  if(t.dataset.opensys){ S.cur=t.dataset.opensys; save(); if(t.tagName==="A") { route(); return; } location.hash="#stage-4"; return; }
  if(t.dataset.dupsys){ const src=S.systems.find(x=>x.id===t.dataset.dupsys); const s=newSys(); s.a=JSON.parse(JSON.stringify(src.a)); s.a.sys=(s.a.sys||"System")+" (copy)"; s.a.gates=[]; s.a.risks=[]; S.systems.push(s); save(); route(); toast("Duplicated"); return; }
  if(t.dataset.delsys){ const id=t.dataset.delsys, s=S.systems.find(x=>x.id===id); confirmBox(`Delete ${esc(s.a.sys||"this system")} and all its answers? Download the journey first if you want to keep it.`,"Delete system",()=>{ S.systems=S.systems.filter(x=>x.id!==id); if(S.cur===id) S.cur=S.systems[0]?S.systems[0].id:null; save(); route(); toast("System deleted"); }); return; }
  if(t.id==="wnext"){ if(wIdx<WALKLIST.length-1){ wIdx++; renderPresent(); $("#wcount").focus(); } else location.hash="#walk-room"; return; }
  if(t.id==="wprev"){ if(wIdx>0){ wIdx--; renderPresent(); } return; }
  if(t.id==="startown"){ confirmBox("Clear the worked example and start an empty journey? Download the example first if you want to keep it.","Start our own journey",()=>{ S=blank(); save(); location.hash="#stage-1"; route(); toast("Empty journey: start with your institution, then add AI systems"); }); return; }
  if(t.id==="newjourney"){ const go=()=>{ S=blank(); save(); location.hash="#stage-1"; route(); window.scrollTo(0,0); }; if(S.isExample||(!S.systems.length&&!Object.keys(S.inst).length)) go(); else confirmBox("Start a new journey? This clears the answers in this browser. Download your journey first from the Dossier if you want to keep it.","Start a new journey",go); return; }
  if(t.dataset.loadex){ const which=t.dataset.loadex==="jobs"?"jobs":"chatbot"; const go=()=>{ S=exampleState(which); save(); location.hash="#start"; route(); window.scrollTo(0,0); toast((which==="jobs"?"Job matching":"Chatbot")+" example loaded"); }; if(S.isExample||(!S.systems.length&&!Object.keys(S.inst).length)) go(); else confirmBox("Replace your journey in this browser with the worked example? Download your journey first if you want to keep it.","Load the example",go); return; }
  if(t.id==="resetbtn"){ confirmBox("Clear all answers in this browser? This cannot be undone unless you have downloaded the journey.","Clear everything",()=>{ S=blank(); save(); route(); toast("Cleared"); }); return; }
  if(t.id==="importbtn"){ $("#importfile").click(); return; }
  if(t.id==="copyjson"){ const s=JSON.stringify(S,null,1); navigator.clipboard.writeText(s).then(()=>toast("Journey data copied"),()=>showText("ai-journey.json",s)); return; }
  if(t.id==="dlgcopy"){ const v=$("#dlgtext").value; navigator.clipboard.writeText(v).then(()=>toast("Copied"),()=>{ $("#dlgtext").select(); toast("Select all and copy"); }); return; }
  if(t.id==="dlgclose"){ $("#dlg").classList.remove("open"); return; }
  if(t.dataset.dl){ const base=(A().sys||"ai-journey").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); if(t.dataset.dl==="json") offer("ai-journey-v2.json",JSON.stringify(S,null,1)); if(t.dataset.dl==="trackercsv") offer("ai-hub-tracker-cases.csv",trackerCSV()); if(t.dataset.dl==="csvall") offer("ai-register-all-systems.csv",registerAll()); if(t.dataset.dl==="facpack") offer("facilitator-pack.md",facPackMD()); if(t.dataset.dl==="walkcards") offer("readiness-walk-cards.html",walkCardsHTML()); if(t.dataset.dl==="g2pack") offer(base+"-gate2-evidence-pack.md",gate2MD()); if(t.dataset.dl==="csv") offer(base+"-ai-register-row.csv",registerRow()); if(t.dataset.dl==="md") offer(base+"-dossier.md",dossierMD()); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#dlg").classList.contains("open")) $("#dlg").classList.remove("open"); else if(location.hash==="#walk-present") location.hash="#facilitator"; } if(location.hash==="#walk-present"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ if(e.key==="ArrowRight") $("#wnext").click(); if(e.key==="ArrowLeft"&&wIdx>0) $("#wprev").click(); } });
window.addEventListener("hashchange",()=>{ curTab="read"; route(); window.scrollTo(0,0); });
document.addEventListener("toggle",e=>{ const d=e.target; if(d.dataset&&d.dataset.fold) OPENF[d.dataset.fold]=d.open; },true);
try{ $("#savestate").textContent = S.isExample?"Showing a worked example":localStorage.getItem(KEY)?"Saved in this browser":""; }catch(e){ $("#savestate").textContent="Browser storage unavailable: download your journey to keep it"; }
route();
</script>
